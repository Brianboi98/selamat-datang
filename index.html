<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typewriter Welcome</title>
    <style>
        /* Centers everything on the screen */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }
        
        /* Styles the text and adds the blinking cursor */
        h1 {
            color: #333333;
            font-size: 3rem;
            border-right: 4px solid #333333; /* The cursor */
            padding-right: 5px;
            /* Animation for the blinking cursor */
            animation: blink-cursor 0.8s steps(2, start) infinite;
        }

        /* The keyframes that make the cursor blink */
        @keyframes blink-cursor {
            0%, 100% { border-color: transparent; }
            50% { border-color: #333333; }
        }
    </style>
</head>
<body>

    <h1 id="typewriter-text"></h1>

    <script>
        // The text we want to type out. Array.from ensures the emoji stays intact.
        const textToType = Array.from("Selamat Datang 😊");
        const speed = 150; // Typing speed in milliseconds (lower is faster)
        let index = 0;
        const textElement = document.getElementById("typewriter-text");

        // The function that types out the text letter by letter
        function typeWriter() {
            if (index < textToType.length) {
                textElement.innerHTML += textToType[index];
                index++;
                setTimeout(typeWriter, speed);
            }
        }

        // Start the typing effect when the page loads
        window.onload = typeWriter;
    </script>

</body>
</html>

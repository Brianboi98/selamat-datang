<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Typewriter</title>
    <style>
        /* Centers everything and adds padding for small screens */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 0 20px; /* Prevents text from touching the edge of the phone */
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center; /* Keeps text centered if it drops to a new line */
        }
        
        /* Styles the text with fluid size and blinking cursor */
        h1 {
            color: #333333;
            /* Fluid typography: Minimum 1.8rem, scales dynamically with screen (6vw), Max 3.5rem */
            font-size: clamp(1.8rem, 6vw, 3.5rem); 
            border-right: 4px solid #333333;
            padding-right: 5px;
            margin: 0;
            animation: blink-cursor 0.8s steps(2, start) infinite;
        }

        /* The keyframes that make the cursor blink */
        @keyframes blink-cursor {
            0%, 100% { border-color: transparent; }
            50% { border-color: #333333; }
        }
    </style>
</head>
<body>

    <h1 id="typewriter-text"></h1>

    <script>
        // The text we want to type out
        const textToType = Array.from("Selamat Datang 😊");
        const speed = 150; // Typing speed in milliseconds
        let index = 0;
        const textElement = document.getElementById("typewriter-text");

        // The function that types out the text
        function typeWriter() {
            if (index < textToType.length) {
                textElement.innerHTML += textToType[index];
                index++;
                setTimeout(typeWriter, speed);
            }
        }

        // Start the typing effect when the page loads
        window.onload = typeWriter;
    </script>

</body>
</html>

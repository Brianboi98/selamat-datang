<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Typewriter Widget</title>
    <style>
        :root {
            --text-color: #37352f;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text-color: rgba(255, 255, 255, 0.81);
            }
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 0 10px;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji";
            background-color: transparent;
            text-align: center;
            color: var(--text-color);
        }

        h1 {
            font-size: clamp(1.8rem, 5vw, 3rem);
            border-right: 4px solid var(--text-color);
            padding-right: 5px;
            margin: 0;
            animation: blink-cursor 0.8s steps(2, start) infinite;
            min-height: 3.5rem;
        }

        @keyframes blink-cursor {
            0%, 100% { border-color: transparent; }
            50%       { border-color: var(--text-color); }
        }
    </style>
</head>
<body>

    <h1 id="typewriter-text"></h1>

    <script>
        const textToType = Array.from("Selamat Datang 😊");
        let index = 0;
        let isDeleting = false;
        const textElement = document.getElementById("typewriter-text");

        function loopTypeWriter() {
            let typeSpeed = 150;

            if (isDeleting) {
                index--;
                typeSpeed = 75;
            } else {
                index++;
            }

            textElement.innerHTML = textToType.slice(0, index).join('');

            if (!isDeleting && index === textToType.length) {
                isDeleting = true;
                typeSpeed = 2000;
            } else if (isDeleting && index === 0) {
                isDeleting = false;
                typeSpeed = 500;
            }

            setTimeout(loopTypeWriter, typeSpeed);
        }

        window.onload = loopTypeWriter;
    </script>

</body>
</html>
